<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1b">
  <title>لوحة المدير | رسالة من مجهول</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: 'Cairo', sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #34204d 0%, transparent 55%),
        #100d1b;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: clamp(24px, 5vw, 34px);
      margin: 12px 0;
    }

    .subtitle {
      text-align: center;
      color: #bdb2ce;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 20px 55px rgba(0,0,0,.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(9,7,16,.6);
      color: #fff;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #bd83f4;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(110deg, #bd83f4, #8953cf);
      color: #160b24;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .login-button {
      width: 100%;
      margin-top: 18px;
    }

    .secondary {
      background: #30263d;
      color: #fff;
    }

    .danger {
      background: #762d46;
      color: #fff;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input {
      flex: 1;
      min-width: 180px;
    }

    .toolbar button {
      min-height: 48px;
    }

    .message {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      padding: 17px;
      margin-top: 14px;
      background: rgba(0,0,0,.16);
    }

    .message p {
      line-height: 1.9;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .meta {
      color: #c7b8da;
      font-size: 12px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .message-text {
      background: rgba(255,255,255,.04);
      border-radius: 10px;
      padding: 12px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .empty {
      text-align: center;
      color: #bdb2ce;
      padding: 24px 8px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .topline h2 {
      margin: 0;
      font-size: 20px;
    }

    .count {
      color: #d9b5ff;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #80758f;
      font-size: 11px;
      margin-top: 25px;
    }

    @media (max-width: 500px) {
      .card {
        padding: 16px;
      }

      .toolbar button {
        width: 100%;
      }
    }
  </style></head><body>
  <main class="container">
    <h1>💌 لوحة إدارة الرسائل</h1>
    <p class="subtitle">صفحة خاصة بإدارة الرسائل الواردة</p><section class="card" id="loginCard">
  <h2>تسجيل دخول المدير</h2>

  <form id="loginForm">
    <label for="email">البريد الإلكتروني</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="أدخل بريد المدير"
      required
    >

    <label for="password">كلمة المرور</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="أدخل كلمة المرور"
      required
    >

    <button class="login-button" id="loginButton" type="submit">
      تسجيل الدخول
    </button>
  </form>

  <div class="status" id="loginStatus" role="status" aria-live="polite"></div>
</section>

<section id="dashboard" class="hidden">
  <div class="card">
    <div class="topline">
      <h2>الرسائل الواردة</h2>
      <span class="count" id="messageCount">عدد الرسائل: 0</span>
    </div>

    <div class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="ابحث باسم المرسل أو المستلم أو نص الرسالة"
      >

      <button class="secondary" id="refreshButton" type="button">
        تحديث الرسائل
      </button>

      <button class="secondary" id="logoutButton" type="button">
        تسجيل الخروج
      </button>
    </div>

    <div class="status" id="dashboardStatus" role="status" aria-live="polite"></div>
    <div id="messagesList">
      <div class="empty">جارٍ تحميل الرسائل...</div>
    </div>
  </div>
</section>

<div class="footer">رسالة من مجهول · لوحة الإدارة</div>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="admin.js"></script></body>
</html>
